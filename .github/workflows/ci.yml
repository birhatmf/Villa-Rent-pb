name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to AlmaLinux Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== Dağıtım Başladı: $(date) ==="
            cd /home/birhatmff/villa-realestate-rent

            echo "--- Git Kodları Çekiliyor ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Backend Güncelleniyor ---"
            cd /home/birhatmff/villa-realestate-rent/backend
            npm install --legacy-peer-deps
            npx prisma generate
            npx prisma migrate deploy
            npm run build

            echo "--- Frontend Güncelleniyor ---"
            cd /home/birhatmff/villa-realestate-rent/frontend
            npm install --legacy-peer-deps
            npm run build

            echo "--- PM2 Servisleri Yeniden Başlatılıyor ---"
            cd /home/birhatmff/villa-realestate-rent
            pm2 reload ecosystem.config.js --update-env || pm2 restart ecosystem.config.js

            echo "=== Dağıtım Başarıyla Tamamlandı! ==="
